<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nigar Aliyeva - Software Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app" id="app">
        <piano-arena id="piano"></piano-arena>

        <!-- dark edges around the screen -->
        <div class="vignette"></div>

        <!-- title screen -->
        <div class="title-screen" id="title-screen">
            <div class="title-top">
                <div class="pixel title-player">PLAYER 1</div>
                <div class="pixel title-name" id="title-name"></div>
                <div class="pixel title-role" id="title-role"></div>
            </div>
            <div class="title-bottom">
                <div class="pixel press-start">PRESS START</div>
                <div class="pixel title-hint">ZOOM INTO THE KEYS TO EXPLORE</div>
                <div class="pixel title-arrow">▼</div>
            </div>  
        </div>

         <!-- top bar -->
        <div class="hud">
            <div class="hud-player">
                <div class="pixel hud-badge">P1</div>
                <div class="hud-info">
                <div class="pixel hud-name" id="hud-name"></div>
                <div class="pixel hud-level">LV <span id="hud-level">1</span> · DEVELOPER</div>
                </div>
            </div>

            <div class="hud-stats">
                <div class="hud-xp-block">
                <div class="hud-xp-row">
                    <span class="pixel hud-label">XP</span>
                    <div class="xp-bar" id="xp-bar"></div>
                </div>
                <div class="pixel hud-progress" id="hud-progress"></div>
                </div>

                <div class="hud-score-block">
                <span class="pixel hud-label">SCORE</span>
                <span class="pixel hud-score" id="hud-score"></span>
                </div>

                <div class="hud-buttons">
                <button type="button" class="pixel hud-button" id="audio-button">SFX ON</button>
                <button type="button" class="pixel hud-button hud-button--pink" id="wide-button">TITLE</button>
                </div>
            </div>
        </div>

         <!-- key buttons -->
        <div class="rail" id="rail">
            <div class="pixel rail-hint">PRESS 1–6 OR HIT A GLOWING KEY</div>
            <div class="rail-keys" id="rail-keys"></div>
        </div>

        <!-- stage panel -->
        <div class="panel-layer">
            <div class="panel-backdrop" id="panel-backdrop"></div>
            <div class="panel" id="panel">
                <div class="panel-header">
                    <span class="pixel panel-title" id="panel-title"></span>
                    <button type="button" class="pixel panel-close" id="panel-close">ESC ✕</button>
                </div>
                <div class="panel-tabs" id="panel-tabs"></div>
                <div class="panel-body" id="stage-content"></div>
            </div>
        </div>
    </div>
</body>
</html>
